<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#5b4ce6"/>
			<stop offset=".45" stop-color="#6d5efc"/>
			<stop offset="1" stop-color="#9b5cff"/>
		</linearGradient>
		<linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6d5efc"/>
			<stop offset="1" stop-color="#9b5cff"/>
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
			<feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e1466" flood-opacity=".32"/>
		</filter>
		<filter id="shadow-sm" x="-20%" y="-30%" width="140%" height="180%">
			<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1466" flood-opacity=".28"/>
		</filter>
		<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
			<circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".16"/>
		</pattern>
	</defs>

	<rect width="1544" height="500" fill="url(#bg)"/>
	<circle cx="1400" cy="-40" r="330" fill="#fff" opacity=".07"/>
	<circle cx="1130" cy="560" r="250" fill="#fff" opacity=".05"/>
	<circle cx="-40" cy="520" r="220" fill="#fff" opacity=".05"/>
	<rect x="690" y="40" width="176" height="132" fill="url(#dots)"/>

	<!-- Mark + eyebrow -->
	<rect x="88" y="84" width="64" height="64" rx="16" fill="#fff"/>
	<g transform="translate(100 96) scale(1.6667)" fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<ellipse cx="12" cy="6" rx="8" ry="3"/>
		<path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/>
		<path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/>
	</g>
	<text x="172" y="123" font-size="18" font-weight="600" letter-spacing="3" fill="#fff" fill-opacity=".85">CLEAN · OPTIMIZE · MANAGE</text>

	<!-- Title -->
	<text x="86" y="236" font-size="78" font-weight="800" letter-spacing="-2" fill="#fff">Database Cleaner</text>
	<text x="86" y="320" font-size="78" font-weight="800" letter-spacing="-2" fill="#ddd6ff">&amp; Optimizer</text>

	<!-- Feature chips -->
	<g font-size="18" font-weight="600" fill="#fff" text-anchor="middle">
		<g fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".3">
			<rect x="88" y="372" width="118" height="42" rx="21"/>
			<rect x="218" y="372" width="128" height="42" rx="21"/>
			<rect x="358" y="372" width="118" height="42" rx="21"/>
			<rect x="488" y="372" width="96" height="42" rx="21"/>
			<rect x="596" y="372" width="96" height="42" rx="21"/>
			<rect x="704" y="372" width="118" height="42" rx="21"/>
		</g>
		<text x="147" y="399">Revisions</text>
		<text x="282" y="399">Transients</text>
		<text x="417" y="399">Autoload</text>
		<text x="536" y="399">Tables</text>
		<text x="644" y="399">Cron</text>
		<text x="763" y="399">Backups</text>
	</g>

	<!-- Dashboard card -->
	<g filter="url(#shadow)">
		<rect x="924" y="66" width="532" height="368" rx="20" fill="#fff"/>
	</g>
	<rect x="950" y="92" width="38" height="38" rx="10" fill="url(#brand)"/>
	<g transform="translate(957 99)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
		<ellipse cx="12" cy="6" rx="8" ry="3"/>
		<path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6"/>
		<path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/>
	</g>
	<text x="1002" y="118" font-size="20" font-weight="700" fill="#101828">Database health</text>
	<rect x="1342" y="96" width="88" height="30" rx="15" fill="#ecfdf3"/>
	<circle cx="1360" cy="111" r="4" fill="#12b76a"/>
	<text x="1371" y="116" font-size="14" font-weight="600" fill="#0e9355">Good</text>
	<rect x="924" y="150" width="532" height="1" fill="#eaecf5"/>

	<!-- Score gauge -->
	<circle cx="1028" cy="262" r="60" fill="none" stroke="#eaecf5" stroke-width="13"/>
	<circle cx="1028" cy="262" r="60" fill="none" stroke="#12b76a" stroke-width="13" stroke-linecap="round"
		stroke-dasharray="313 377" transform="rotate(-90 1028 262)"/>
	<text x="1028" y="272" font-size="42" font-weight="800" fill="#101828" text-anchor="middle" letter-spacing="-1">83</text>
	<text x="1028" y="292" font-size="13" fill="#667085" text-anchor="middle">/ 100</text>

	<!-- Cleanup rows -->
	<g font-size="16" font-weight="600" fill="#101828">
		<rect x="1122" y="176" width="308" height="48" rx="12" fill="#f4f0ff"/>
		<rect x="1122" y="176" width="4" height="48" rx="2" fill="#6d5efc"/>
		<text x="1142" y="206">Post revisions</text>
		<rect x="1122" y="234" width="308" height="48" rx="12" fill="#fff4ec"/>
		<rect x="1122" y="234" width="4" height="48" rx="2" fill="#f79009"/>
		<text x="1142" y="264">Expired transients</text>
		<rect x="1122" y="292" width="308" height="48" rx="12" fill="#eef4ff"/>
		<rect x="1122" y="292" width="4" height="48" rx="2" fill="#2e90fa"/>
		<text x="1142" y="322">Autoload size</text>
	</g>
	<g font-size="14" font-weight="700" text-anchor="end">
		<text x="1414" y="205" fill="#5b4ce6">1,284</text>
		<text x="1414" y="263" fill="#c56f00">312</text>
		<text x="1414" y="321" fill="#1570cd">86 KB</text>
	</g>

	<!-- Actions -->
	<rect x="1122" y="360" width="148" height="44" rx="11" fill="url(#brand)"/>
	<text x="1196" y="388" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Clean up</text>
	<rect x="1282.5" y="360.5" width="148" height="43" rx="11" fill="#fff" stroke="#dfe1ee"/>
	<text x="1356" y="388" font-size="16" font-weight="600" fill="#5b4ce6" text-anchor="middle">Preview</text>

	<!-- Floating snapshot card -->
	<g filter="url(#shadow-sm)">
		<rect x="856" y="360" width="236" height="72" rx="16" fill="#fff"/>
	</g>
	<circle cx="894" cy="396" r="19" fill="#ecfdf3"/>
	<path d="M885.5 396.5l5.5 5.5 11-11.5" fill="none" stroke="#12b76a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
	<text x="924" y="392" font-size="16" font-weight="700" fill="#101828">Snapshot saved</text>
	<text x="924" y="412" font-size="13" fill="#667085">before risky changes</text>
</svg>
