<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6d5efc"/>
			<stop offset="1" stop-color="#9b5cff"/>
		</linearGradient>
	</defs>
	<rect width="256" height="256" fill="url(#bg)"/>
	<circle cx="214" cy="30" r="96" fill="#fff" opacity=".07"/>
	<circle cx="30" cy="236" r="80" fill="#fff" opacity=".05"/>

	<!-- Health ring: the Dashboard score gauge -->
	<circle cx="128" cy="128" r="90" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="15"/>
	<circle cx="128" cy="128" r="90" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"
